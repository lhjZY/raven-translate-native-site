<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="changelog.docTitle">更新日志 · Raven-Translate</title>
    <meta
      name="description"
      content="Raven-Translate 各版本的更新内容。"
      data-i18n-attr="content:changelog.description"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- 首帧前应用已保存的主题，避免闪烁；逻辑与 main.js 的 THEME_KEY 保持一致。 -->
    <script>
      try {
        const t = localStorage.getItem("raven-site-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" href="assets/icon.png" />
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="sections.css" />
    <link rel="stylesheet" href="changelog.css" />
  </head>
  <body>
    <a class="skip" href="#main" data-i18n="nav.skip">跳到正文</a>

    <header class="nav">
      <a class="brand" href="./" aria-label="Raven-Translate">
        <span class="brand-wordmark" aria-hidden="true"></span>
      </a>
      <div class="nav-actions">
        <a class="nav-link" href="changelog.html" aria-current="page" data-i18n="nav.changelog"
          >更新日志</a
        >
        <button class="theme" type="button" id="theme-toggle" aria-label="切换到深色主题">
          <svg
            class="icon-moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z" />
          </svg>
          <svg
            class="icon-sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"
            />
          </svg>
        </button>
        <button
          class="lang"
          type="button"
          id="lang-toggle"
          aria-label="Switch to English"
          data-i18n-attr="aria-label:lang.switchLabel"
        >
          <span data-i18n="lang.switch">EN</span>
        </button>
        <a
          class="btn btn-small"
          href="https://github.com/lhjZY/Raven-t/releases/download/v0.2.2/Raven-Translate-0.2.2-arm64.dmg"
          data-i18n="cta.download"
          >下载</a
        >
      </div>
    </header>

    <main id="main">
      <section class="changelog">
        <h1 data-i18n="changelog.title">更新日志</h1>
        <p class="lede" data-i18n="changelog.lede">Raven-Translate 每个版本的变化。</p>
        <div id="changelog-list" class="releases">
          <noscript>
            <p class="meta">需要启用 JavaScript 才能查看更新日志。</p>
          </noscript>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>© 2026 Raven-Translate</span>
      <span data-i18n="footer.trademark">Google、Microsoft、DeepSeek 为其各自所有者的商标。</span>
    </footer>

    <script src="i18n.js"></script>
    <script src="changelog.js"></script>
    <script src="main.js"></script>
  </body>
</html>
